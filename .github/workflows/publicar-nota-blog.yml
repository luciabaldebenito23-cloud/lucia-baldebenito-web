name: Publicar notas programadas del blog

# Corre todos los días a las 8:00 (hora Argentina) = 11:00 UTC.
# Publica cada nota de _programado/ cuya fecha ya llegó:
#   _programado/SLUG.html       -> la nota completa
#   _programado/SLUG.card.html  -> 1.ª línea "<!-- publicar: AAAA-MM-DD -->"
#                                  + la tarjeta para el blog del inicio
# Al publicar: mueve la nota a blog/, pone la tarjeta primera en el inicio
# y suma la página al sitemap. Si no hay nada para hoy, no hace nada.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar las notas cuya fecha ya llegó
        id: publicar
        run: |
          python3 - <<'PY'
          import datetime, glob, io, os, re, subprocess
          hoy = (datetime.datetime.utcnow() - datetime.timedelta(hours=3)).date()
          publicadas = []
          for card_path in sorted(glob.glob("_programado/*.card.html")):
              slug = os.path.basename(card_path)[:-len(".card.html")]
              nota = f"_programado/{slug}.html"
              card = io.open(card_path, encoding="utf-8").read()
              m = re.match(r"\s*<!--\s*publicar:\s*(\d{4}-\d{2}-\d{2})\s*-->\n?", card)
              if not m or not os.path.exists(nota):
                  print(f"Salteo {slug}: falta la fecha o la nota"); continue
              fecha = datetime.date.fromisoformat(m.group(1))
              if fecha > hoy:
                  print(f"{slug}: programada para {fecha}, todavía no"); continue
              card = card[m.end():]
              subprocess.run(["git", "mv", nota, f"blog/{slug}.html"], check=True)
              subprocess.run(["git", "rm", "--quiet", card_path], check=True)
              s = io.open("index.html", encoding="utf-8").read()
              if f'href="blog/{slug}.html"' not in s:
                  anchor = '<div class="cards-grid blog-grid">\n'
                  j = s.index(anchor, s.index('id="blog"')) + len(anchor)
                  s = s[:j] + card + s[j:]
                  io.open("index.html", "w", encoding="utf-8").write(s)
              s = io.open("sitemap.xml", encoding="utf-8").read()
              url = f"https://luciabaldebenito.com.ar/blog/{slug}.html"
              if url not in s:
                  s = s.replace("</urlset>", f"<url>\n<loc>{url}</loc>\n<lastmod>{fecha}</lastmod>\n<changefreq>monthly</changefreq>\n<priority>0.6</priority>\n</url>\n</urlset>")
                  io.open("sitemap.xml", "w", encoding="utf-8").write(s)
              publicadas.append(slug)
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write("hecho=" + ("si" if publicadas else "no") + "\n")
              f.write("notas=" + ", ".join(publicadas) + "\n")
          print("Publicadas:", publicadas or "ninguna")
          PY

      - name: Guardar los cambios
        if: steps.publicar.outputs.hecho == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog index.html sitemap.xml _programado
          git commit -m "Publicar nota: ${{ steps.publicar.outputs.notas }}"
          git push

      - name: Pedir a GitHub Pages que actualice el sitio
        if: steps.publicar.outputs.hecho == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages se actualiza solo con el push."
